<script>
    // ============================================================
    // 1. CONFIGURACIÓN SUPABASE (SaaS multi-tenant)
    // ============================================================
    lucide.createIcons();
    const PROJECT_URL = 'https://udvpgthitdxtkicenits.supabase.co';
    const PUBLIC_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkdnBndGhpdGR4dGtpY2VuaXRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5OTYxMzAsImV4cCI6MjEwNDU3MjEzMH0.M6sokWDtgis7wPydD-y9OoMYWQSy1DQaQ08LmNQnbtc';
    const db = supabase.createClient(PROJECT_URL, PUBLIC_KEY);

    let currentTenantId = null;
    let tenantConfigGlobal = null;
    let institutoActual = null;
    let aliadoId = null;
    let cursosCargados = [];
    let editorModo = 'alta';
    let editorZoomLevel = 100;

    // ============================================================
    // 2. BOOTSTRAPPER SaaS
    // ============================================================
    async function initTenant() {
        try {
            const hostname = window.location.hostname;
            let tenantSlug = 'default';

            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                const urlParams = new URLSearchParams(window.location.search);
                tenantSlug = urlParams.get('tenant') || 'renmcycf';
            } else {
                const parts = hostname.split('.');
                if (parts.length > 2 && !hostname.includes('github.io')) {
                    tenantSlug = parts[0];
                } else {
                    tenantSlug = 'renmcycf';
                }
            }

            console.log("Cargando entorno SaaS para:", tenantSlug);

            const { data: tenantConfig, error } = await db
                .from('saas_tenants')
                .select('*')
                .eq('slug', tenantSlug)
                .eq('activo', true)
                .single();

            if (error || !tenantConfig) {
                throw new Error("Institución no encontrada o inactiva.");
            }

            currentTenantId = tenantConfig.id;
            tenantConfigGlobal = tenantConfig;
            localStorage.setItem('saas_current_tenant', currentTenantId);

            document.documentElement.style.setProperty('--wl-primary', tenantConfig.color_primario || '#0f172a');
            document.documentElement.style.setProperty('--wl-secondary', tenantConfig.color_secundario || '#d4af37');
            document.documentElement.style.setProperty('--wl-tertiary', tenantConfig.color_terciario || '#1e3a8a');
            document.documentElement.style.setProperty('--wl-background', tenantConfig.color_background || '#050914');

            // Inyectar nombre institucional en todos los spans dinámicos
            const institucionNombres = document.querySelectorAll(
                '.wl-institucion-nombre, .wl-institucion-nombre-corto, #wl-title-institucion, #login-institucion-nombre'
            );
            institucionNombres.forEach(el => {
                if (el) {
                    if (el.classList.contains('wl-institucion-nombre-corto')) {
                        // Nombre corto: primeras 2 palabras o primeros 20 chars
                        const nombre = tenantConfig.nombre_institucion || 'Institución';
                        el.innerText = nombre.length > 20 ? nombre.substring(0, 18) + '…' : nombre;
                    } else {
                        el.innerText = tenantConfig.nombre_institucion;
                    }
                }
            });

            // Dominio dinámico
            const dominios = document.querySelectorAll('.wl-dominio');
            dominios.forEach(el => { el.innerText = hostname; });

            if (document.title.includes('·')) {
                const prefijo = document.title.split('·')[0];
                document.title = `${prefijo} · ${tenantConfig.nombre_institucion}`;
            } else {
                document.title = tenantConfig.nombre_institucion;
            }

            return tenantConfig;
        } catch (err) {
            console.error("Error Bootstrapper SaaS:", err);
            document.body.innerHTML = `
                <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px;">
                    <div>
                        <h1 style="font-size: 2rem; margin-bottom: 10px; color: #ef4444;">Error 404</h1>
                        <p>La institución a la que intentas acceder no está registrada o se encuentra inactiva.</p>
                    </div>
                </div>`;
            throw err;
        }
    }

    // ==========================================
    // 3. TEMA
    // ==========================================
    function aplicarTemaGuardado() {
        const tema = localStorage.getItem('asari_instituto_theme') || 'dark';
        const icon = document.getElementById('theme-icon');
        if (tema === 'light') {
            document.body.classList.add('light-theme');
            if (icon) icon.setAttribute('data-lucide', 'moon');
        } else {
            document.body.classList.remove('light-theme');
            if (icon) icon.setAttribute('data-lucide', 'sun');
        }
        lucide.createIcons();
    }

    function toggleTema() {
        const isLight = document.body.classList.toggle('light-theme');
        localStorage.setItem('asari_instituto_theme', isLight ? 'light' : 'dark');
        const icon = document.getElementById('theme-icon');
        if (icon) { icon.setAttribute('data-lucide', isLight ? 'moon' : 'sun'); lucide.createIcons(); }
    }

    // ==========================================
    // 4. EDITOR DE DIPLOMAS (mismo que antes, sin cambios funcionales)
    // ==========================================
    const defaultEditorState = () => ({
        posX: 50, posY: 50,
        fontFamily: "'Outfit', sans-serif",
        fontWeight: 900, fontSize: 16, fontColor: '#0a1128',
        textAlign: 'center', lineHeight: 1.1,
        autoFit: true, maxWidth: 85,
        showNombre: true, showDni: true, showCurso: true, showCarga: true,
        showGrid: false, showGuides: false,
        diplomaImage: ''
    });

    let editorState = {
        alta: defaultEditorState(),
        edit: defaultEditorState(),
        active: defaultEditorState()
    };

    function _editorGetEls() {
        return {
            sliderX: document.getElementById('editor-slider-x'),
            sliderY: document.getElementById('editor-slider-y'),
            labelX: document.getElementById('editor-label-x'),
            labelY: document.getElementById('editor-label-y'),
            texto: document.getElementById('editor-preview-texto-alumno'),
            grid: document.getElementById('editor-grid-active'),
            guideH: document.getElementById('editor-guide-h-active'),
            guideV: document.getElementById('editor-guide-v-active'),
            fontFamily: document.getElementById('editor-font-family'),
            fontWeight: document.getElementById('editor-font-weight'),
            fontSize: document.getElementById('editor-font-size'),
            fontSizeLabel: document.getElementById('editor-size-label'),
            fontColor: document.getElementById('editor-font-color'),
            textAlign: document.getElementById('editor-text-align'),
            lineHeight: document.getElementById('editor-line-height'),
            lineHeightLabel: document.getElementById('editor-lineheight-label'),
            autoFitSwitch: document.getElementById('editor-autofit-switch'),
            maxWidth: document.getElementById('editor-max-width'),
            maxWidthLabel: document.getElementById('editor-maxwidth-label'),
            showNombre: document.getElementById('editor-show-nombre'),
            showDni: document.getElementById('editor-show-dni'),
            showCurso: document.getElementById('editor-show-curso'),
            showCarga: document.getElementById('editor-show-carga'),
            upper: document.getElementById('editor-preview-diploma-upper'),
            placeholder: document.getElementById('editor-preview-placeholder'),
            stageInner: document.getElementById('editor-stage-inner-active'),
            zoomLabel: document.getElementById('editor-zoom-label')
        };
    }

    function _editorRender() {
        const st = editorState.active;
        const els = _editorGetEls();
        if (!els.texto) return;
        els.texto.style.top = `${st.posY}%`;
        els.texto.style.left = `${st.posX}%`;
        els.texto.style.transform = 'translate(-50%, -50%)';
        els.texto.style.maxWidth = `${st.maxWidth}%`;
        if (els.labelX) els.labelX.textContent = `${st.posX}%`;
        if (els.labelY) els.labelY.textContent = `${st.posY}%`;
        if (els.guideH) els.guideH.style.top = `${st.posY}%`;
        if (els.guideV) els.guideV.style.left = `${st.posX}%`;
        const nombre = els.texto.querySelector('.pdt-nombre');
        const dni = els.texto.querySelector('.pdt-dni');
        const curso = els.texto.querySelector('.pdt-curso');
        const carga = els.texto.querySelector('.pdt-carga');
        if (nombre) { nombre.style.fontFamily = st.fontFamily; nombre.style.fontWeight = st.fontWeight; nombre.style.fontSize = st.fontSize + 'px'; nombre.style.color = st.fontColor; nombre.style.lineHeight = st.lineHeight; nombre.style.textAlign = st.textAlign; nombre.style.display = st.showNombre ? '' : 'none'; }
        if (dni) { dni.style.fontFamily = st.fontFamily; dni.style.fontWeight = Math.min(st.fontWeight, 700); dni.style.fontSize = Math.max(9, st.fontSize * 0.7) + 'px'; dni.style.textAlign = st.textAlign; dni.style.display = st.showDni ? '' : 'none'; }
        if (curso) { curso.style.fontFamily = st.fontFamily; curso.style.fontWeight = st.fontWeight; curso.style.fontSize = Math.max(10, st.fontSize * 0.75) + 'px'; curso.style.lineHeight = st.lineHeight; curso.style.textAlign = st.textAlign; curso.style.display = st.showCurso ? '' : 'none'; }
        if (carga) { carga.style.fontFamily = st.fontFamily; carga.style.fontSize = Math.max(8, st.fontSize * 0.55) + 'px'; carga.style.textAlign = st.textAlign; carga.style.display = st.showCarga ? '' : 'none'; }
        els.texto.style.textAlign = st.textAlign;
        if (st.autoFit) _editorAutoFit();
    }

    function _editorAutoFit() {
        const st = editorState.active;
        const els = _editorGetEls();
        if (!els.texto) return;
        const nombre = els.texto.querySelector('.pdt-nombre');
        const curso = els.texto.querySelector('.pdt-curso');
        if (!nombre) return;
        const containerWidth = els.texto.parentElement.clientWidth;
        const maxWidthPx = (st.maxWidth / 100) * containerWidth;
        nombre.style.fontSize = st.fontSize + 'px';
        if (curso) curso.style.fontSize = Math.max(10, st.fontSize * 0.75) + 'px';
        let nombreSize = st.fontSize;
        let iter = 0;
        while (nombre.scrollWidth > maxWidthPx && nombreSize > 8 && iter < 30) {
            nombreSize -= 0.5;
            nombre.style.fontSize = nombreSize + 'px';
            iter++;
        }
        if (curso) {
            let cursoSize = Math.max(10, st.fontSize * 0.75);
            let it2 = 0;
            while (curso.scrollWidth > maxWidthPx && cursoSize > 7 && it2 < 30) {
                cursoSize -= 0.5;
                curso.style.fontSize = cursoSize + 'px';
                it2++;
            }
        }
    }

    function _editorSyncUI() {
        const st = editorState.active;
        const els = _editorGetEls();
        if (els.sliderX) els.sliderX.value = st.posX;
        if (els.sliderY) els.sliderY.value = st.posY;
        if (els.fontFamily) els.fontFamily.value = st.fontFamily;
        if (els.fontWeight) els.fontWeight.value = st.fontWeight;
        if (els.fontSize) els.fontSize.value = st.fontSize;
        if (els.fontSizeLabel) els.fontSizeLabel.textContent = st.fontSize + 'px';
        if (els.fontColor) els.fontColor.value = st.fontColor;
        if (els.textAlign) els.textAlign.value = st.textAlign;
        if (els.lineHeight) els.lineHeight.value = st.lineHeight;
        if (els.lineHeightLabel) els.lineHeightLabel.textContent = st.lineHeight.toFixed(2);
        if (els.maxWidth) els.maxWidth.value = st.maxWidth;
        if (els.maxWidthLabel) els.maxWidthLabel.textContent = st.maxWidth + '%';
        if (els.autoFitSwitch) els.autoFitSwitch.classList.toggle('active', st.autoFit);
        if (els.showNombre) els.showNombre.classList.toggle('active', st.showNombre);
        if (els.showDni) els.showDni.classList.toggle('active', st.showDni);
        if (els.showCurso) els.showCurso.classList.toggle('active', st.showCurso);
        if (els.showCarga) els.showCarga.classList.toggle('active', st.showCarga);
        if (els.grid) els.grid.classList.toggle('active', st.showGrid);
        if (els.guideH) els.guideH.classList.toggle('active', st.showGuides);
        if (els.guideV) els.guideV.classList.toggle('active', st.showGuides);
        const btnGrid = document.getElementById('editor-btn-toggle-grid');
        const btnGuides = document.getElementById('editor-btn-toggle-guides');
        if (btnGrid) btnGrid.classList.toggle('active', st.showGrid);
        if (btnGuides) btnGuides.classList.toggle('active', st.showGuides);
    }

    function _editorApplyImage(imgSrc) {
        const els = _editorGetEls();
        if (!els.upper) return;
        if (imgSrc) {
            els.upper.style.backgroundImage = `url('${imgSrc}')`;
            if (els.placeholder) els.placeholder.classList.add('hidden');
        } else {
            els.upper.style.backgroundImage = '';
            if (els.placeholder) els.placeholder.classList.remove('hidden');
        }
    }

    function _editorSyncHiddenOutputs() {
        const st = editorState.active;
        if (editorModo === 'alta') {
            const hx = document.getElementById('pos-x');
            const hy = document.getElementById('pos-y');
            const hc = document.getElementById('diseno-config');
            if (hx) hx.value = st.posX;
            if (hy) hy.value = st.posY;
            if (hc) hc.value = JSON.stringify(_editorSerializeForDB());
        } else if (editorModo === 'edit') {
            const hx = document.getElementById('edit-pos-x');
            const hy = document.getElementById('edit-pos-y');
            const hc = document.getElementById('edit-diseno-config');
            if (hx) hx.value = st.posX;
            if (hy) hy.value = st.posY;
            if (hc) hc.value = JSON.stringify(_editorSerializeForDB());
        }
    }

    function _editorSerializeForDB() {
        const st = editorState.active;
        return {
            posX: st.posX, posY: st.posY,
            fontFamily: st.fontFamily, fontWeight: st.fontWeight,
            fontSize: st.fontSize, fontColor: st.fontColor,
            textAlign: st.textAlign, lineHeight: st.lineHeight,
            autoFit: st.autoFit, maxWidth: st.maxWidth,
            showNombre: st.showNombre, showDni: st.showDni,
            showCurso: st.showCurso, showCarga: st.showCarga
        };
    }

    function editorApplyTypography() {
        const els = _editorGetEls();
        const st = editorState.active;
        if (els.fontFamily) st.fontFamily = els.fontFamily.value;
        if (els.fontWeight) st.fontWeight = parseInt(els.fontWeight.value);
        if (els.fontSize) st.fontSize = parseInt(els.fontSize.value);
        if (els.fontColor) st.fontColor = els.fontColor.value;
        if (els.textAlign) st.textAlign = els.textAlign.value;
        if (els.lineHeight) st.lineHeight = parseFloat(els.lineHeight.value);
        if (els.fontSizeLabel) els.fontSizeLabel.textContent = st.fontSize + 'px';
        if (els.lineHeightLabel) els.lineHeightLabel.textContent = st.lineHeight.toFixed(2);
        _editorRender();
        _editorSyncHiddenOutputs();
    }

    function editorApplyAutoFit() {
        const els = _editorGetEls();
        const st = editorState.active;
        if (els.maxWidth) st.maxWidth = parseInt(els.maxWidth.value);
        if (els.maxWidthLabel) els.maxWidthLabel.textContent = st.maxWidth + '%';
        _editorRender();
        _editorSyncHiddenOutputs();
    }

    function editorToggleAutoFit() {
        const st = editorState.active;
        const els = _editorGetEls();
        st.autoFit = !st.autoFit;
        if (els.autoFitSwitch) els.autoFitSwitch.classList.toggle('active', st.autoFit);
        _editorRender();
        _editorSyncHiddenOutputs();
    }

    function editorToggleContent(editor, key) {
        const st = editorState.active;
        const map = { nombre: 'showNombre', dni: 'showDni', curso: 'showCurso', carga: 'showCarga' };
        const prop = map[key];
        if (!prop) return;
        st[prop] = !st[prop];
        _editorSyncUI();
        _editorRender();
        _editorSyncHiddenOutputs();
    }

    function editorToggleGrid() {
        const st = editorState.active;
        st.showGrid = !st.showGrid;
        _editorSyncUI();
    }

    function editorToggleGuides() {
        const st = editorState.active;
        st.showGuides = !st.showGuides;
        _editorSyncUI();
    }

    function editorApplyPreset(_, preset) {
        const st = editorState.active;
        switch (preset) {
            case 'center': st.posX = 50; st.posY = 50; break;
            case 'top': st.posX = 50; st.posY = 25; break;
            case 'bottom': st.posX = 50; st.posY = 72; break;
            case 'top-left': st.posX = 30; st.posY = 25; break;
        }
        _editorSyncUI();
        _editorRender();
        _editorSyncHiddenOutputs();
    }

    function editorResetState() {
        if (!confirm('¿Resetear el diseño a los valores por defecto?')) return;
        const img = editorState.active.diplomaImage;
        editorState.active = defaultEditorState();
        editorState.active.diplomaImage = img;
        _editorSyncUI();
        _editorRender();
        _editorApplyImage(img);
        _editorSyncHiddenOutputs();
    }

    function editorFullPreview() {
        const container = document.getElementById('editor-preview-diploma-container');
        if (!container) return;
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out';
        overlay.onclick = () => overlay.remove();
        const clone = container.cloneNode(true);
        clone.style.maxWidth = '95vw';
        clone.style.maxHeight = '90vh';
        clone.style.boxShadow = '0 0 60px rgba(var(--wl-secondary),0.35)';
        overlay.appendChild(clone);
        document.body.appendChild(overlay);
        lucide.createIcons();
    }

    function editorZoom(delta) {
        editorZoomLevel = Math.max(50, Math.min(200, editorZoomLevel + delta));
        const stageInner = document.getElementById('editor-stage-inner-active');
        const label = document.getElementById('editor-zoom-label');
        if (stageInner) stageInner.style.transform = `scale(${editorZoomLevel / 100})`;
        if (label) label.textContent = `${editorZoomLevel}%`;
    }

    function editorTogglePanelSection(header) {
        const section = header.parentElement;
        section.classList.toggle('collapsed');
    }

    function abrirEditorDiploma(modo) {
        editorModo = modo;
        editorState.active = JSON.parse(JSON.stringify(editorState[modo]));
        const ctx = document.getElementById('editor-contexto');
        if (ctx) ctx.textContent = modo === 'alta' ? 'Nuevo Curso · Alta de Diploma' : 'Edición de Curso · Ajuste de Diploma';
        _editorApplyImage(editorState.active.diplomaImage);
        _editorSyncUI();
        _editorRender();
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById('view-editor').classList.add('active');
        document.getElementById('page-title').textContent = 'Editor de Diploma';
        document.getElementById('nav-editor')?.classList.add('active');
        lucide.createIcons();
    }

    function cerrarEditorDiploma() {
        if (editorModo === 'alta') {
            editorState.alta = JSON.parse(JSON.stringify(editorState.active));
            actualizarBadgeDisenoAlta();
            showTab('cursos');
        } else if (editorModo === 'edit') {
            editorState.edit = JSON.parse(JSON.stringify(editorState.active));
            actualizarBadgeDisenoEdit();
            showTab('cursos');
            const editId = document.getElementById('edit-curso-id')?.value;
            if (editId) {
                setTimeout(() => {
                    const modal = document.getElementById('modal-editar-curso');
                    if (modal) modal.classList.add('active');
                }, 100);
            }
        }
    }

    function guardarDisenoEditor() {
        if (editorModo === 'alta') {
            editorState.alta = JSON.parse(JSON.stringify(editorState.active));
            const hx = document.getElementById('pos-x');
            const hy = document.getElementById('pos-y');
            const hc = document.getElementById('diseno-config');
            if (hx) hx.value = editorState.alta.posX;
            if (hy) hy.value = editorState.alta.posY;
            if (hc) hc.value = JSON.stringify(_editorSerializeForDB());
            actualizarBadgeDisenoAlta();
        } else {
            editorState.edit = JSON.parse(JSON.stringify(editorState.active));
            const hx = document.getElementById('edit-pos-x');
            const hy = document.getElementById('edit-pos-y');
            const hc = document.getElementById('edit-diseno-config');
            if (hx) hx.value = editorState.edit.posX;
            if (hy) hy.value = editorState.edit.posY;
            if (hc) hc.value = JSON.stringify(_editorSerializeForDB());
            actualizarBadgeDisenoEdit();
        }
        const btn = event?.target?.closest('button');
        if (btn) {
            const orig = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4"></i> ¡Guardado!';
            lucide.createIcons();
            setTimeout(() => { btn.innerHTML = orig; lucide.createIcons(); }, 1500);
        }
        setTimeout(() => cerrarEditorDiploma(), 400);
    }

    function actualizarBadgeDisenoAlta() {
        const badge = document.getElementById('diseno-badge-alta');
        const status = document.getElementById('diseno-status-alta');
        const placeholder = document.getElementById('diseno-placeholder-alta');
        if (editorState.alta.diplomaImage) {
            status?.classList.remove('hidden');
            placeholder?.classList.add('hidden');
            if (badge) badge.innerHTML = '<i data-lucide="check-circle" class="w-3 h-3"></i> Configurado';
            lucide.createIcons();
        } else {
            status?.classList.add('hidden');
            placeholder?.classList.remove('hidden');
        }
    }

    function actualizarBadgeDisenoEdit() {
        const badgeText = document.getElementById('diseno-badge-edit-text');
        if (badgeText) badgeText.textContent = 'Configurado';
    }

    function resetDisenoAlta() {
        if (!confirm('¿Resetear el diseño del diploma?')) return;
        editorState.alta = defaultEditorState();
        actualizarBadgeDisenoAlta();
    }

    function resetDisenoEdit() {
        if (!confirm('¿Resetear el diseño del diploma?')) return;
        editorState.edit = defaultEditorState();
    }

    function _editorInitListeners() {
        const els = _editorGetEls();
        const st = editorState.active;
        if (els.sliderX) els.sliderX.addEventListener('input', () => { st.posX = parseInt(els.sliderX.value); _editorSyncUI(); _editorRender(); _editorSyncHiddenOutputs(); });
        if (els.sliderY) els.sliderY.addEventListener('input', () => { st.posY = parseInt(els.sliderY.value); _editorSyncUI(); _editorRender(); _editorSyncHiddenOutputs(); });
        if (els.texto) {
            let dragging = false, startX, startY, startLeft, startTop, containerRect;
            els.texto.addEventListener('mousedown', (e) => {
                if (e.target.closest('select, input, button')) return;
                dragging = true; els.texto.classList.add('dragging');
                containerRect = els.texto.parentElement.getBoundingClientRect();
                startX = e.clientX; startY = e.clientY;
                startLeft = (st.posX / 100) * containerRect.width;
                startTop = (st.posY / 100) * containerRect.height;
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                const dx = e.clientX - startX; const dy = e.clientY - startY;
                const newLeft = Math.max(0, Math.min(containerRect.width, startLeft + dx));
                const newTop = Math.max(0, Math.min(containerRect.height, startTop + dy));
                st.posX = Math.round((newLeft / containerRect.width) * 100);
                st.posY = Math.round((newTop / containerRect.height) * 100);
                _editorSyncUI(); _editorRender();
            });
            document.addEventListener('mouseup', () => { if (dragging) { dragging = false; els.texto.classList.remove('dragging'); _editorSyncHiddenOutputs(); } });
        }
    }

    function _initAltaImageWatcher() {
        const inputDiploma = document.getElementById('curso-file-diploma');
        if (!inputDiploma) return;
        inputDiploma.addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            if (!file.type.startsWith('image/')) { alert('Por favor, seleccione un archivo de imagen válido (JPG, PNG, etc.)'); inputDiploma.value = ''; return; }
            const reader = new FileReader();
            reader.onload = function(evt) { editorState.alta.diplomaImage = evt.target.result; actualizarBadgeDisenoAlta(); };
            reader.readAsDataURL(file);
        });
    }

    function _initEditImageWatcher() {
        const inputDiploma = document.getElementById('edit-curso-file-diploma');
        if (!inputDiploma) return;
        inputDiploma.addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            if (!file.type.startsWith('image/')) { alert('Por favor, seleccione un archivo de imagen válido (JPG, PNG, etc.)'); inputDiploma.value = ''; return; }
            const reader = new FileReader();
            reader.onload = function(evt) { editorState.edit.diplomaImage = evt.target.result; };
            reader.readAsDataURL(file);
        });
    }

    // 5. AUTENTICACIÓN (multi-tenant)
    // ==========================================
    async function iniciarSesion(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-password').value.trim();
        const btn = document.getElementById('btn-login');
        const errorDiv = document.getElementById('login-error');
        errorDiv.classList.add('hidden');
        btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto"></i>';
        btn.disabled = true;
        try {
            const { error } = await db.auth.signInWithPassword({ email, password: pass });
            if (error) throw error;
            await verificarSesion();
        } catch (err) {
            errorDiv.innerText = "Credenciales incorrectas.";
            errorDiv.classList.remove('hidden');
            btn.innerHTML = 'INGRESAR';
            btn.disabled = false;
        }
        lucide.createIcons();
    }

    async function verificarSesion() {
        const { data: { session }, error } = await db.auth.getSession();
        if (error || !session) { document.getElementById('login-screen').style.display = 'flex'; return; }

        const { data: rolData, error: rolError } = await db
            .from('renmcycf_roles')
            .select('rol, activo, nombres, apellidos, aliado_id, tenant_id')
            .eq('user_id', session.user.id)
            .eq('tenant_id', currentTenantId)
            .single();

        if (rolError || !rolData || !rolData.activo) { await db.auth.signOut(); mostrarErrorLogin("Acceso denegado. Cuenta inactiva o inexistente para esta institución."); return; }
        if (rolData.rol !== 'director') { await db.auth.signOut(); mostrarErrorLogin("Acceso denegado. Esta cuenta no tiene privilegios institucionales."); return; }
        if (!rolData.aliado_id) { await db.auth.signOut(); mostrarErrorLogin("Acceso denegado. Su cuenta no está vinculada a ninguna institución."); return; }

        aliadoId = rolData.aliado_id;

        const { data: aliado, error: aliadoError } = await db
            .from('renmcycf_aliados')
            .select('*')
            .eq('id', aliadoId)
            .eq('tenant_id', currentTenantId)
            .single();

        if (aliadoError || !aliado) { await db.auth.signOut(); mostrarErrorLogin("Error: No se encontró la institución asociada."); return; }
        institutoActual = aliado;

        if (aliado.logo_url) {
            const headerImg = document.getElementById('header-logo-img');
            const headerIcon = document.getElementById('header-logo-icon');
            if (headerImg && headerIcon) { headerImg.src = aliado.logo_url; headerImg.classList.remove('hidden'); headerIcon.classList.add('hidden'); }
            const sideImg = document.getElementById('sidebar-logo-img');
            const sideIcon = document.getElementById('sidebar-logo-icon');
            if (sideImg && sideIcon) { sideImg.src = aliado.logo_url; sideImg.classList.remove('hidden'); sideIcon.classList.add('hidden'); }
        }
        const sideName = document.getElementById('sidebar-instituto-nombre');
        if (sideName) sideName.textContent = aliado.nombre || 'Mi Instituto';
        document.getElementById('header-instituto').textContent = aliado.nombre || 'Instituto';
        document.getElementById('header-timbres').textContent = `Derechos: ${aliado.saldo_timbres || 0}`;
        document.getElementById('login-screen').style.display = 'none';
        await cargarDashboardInstituto();
        showTab('dashboard');
        lucide.createIcons();
    }

    function mostrarErrorLogin(mensaje) {
        const errorDiv = document.getElementById('login-error');
        errorDiv.innerText = mensaje;
        errorDiv.classList.remove('hidden');
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('btn-login').innerHTML = 'INGRESAR';
        document.getElementById('btn-login').disabled = false;
        lucide.createIcons();
    }

    async function cerrarSesion() {
        await db.auth.signOut();
        institutoActual = null; aliadoId = null; cursosCargados = [];
        document.getElementById('login-email').value = '';
        document.getElementById('login-password').value = '';
        document.getElementById('login-error').classList.add('hidden');
        document.getElementById('btn-login').innerHTML = 'INGRESAR';
        document.getElementById('btn-login').disabled = false;
        document.getElementById('login-screen').style.display = 'flex';
        const headerImg = document.getElementById('header-logo-img');
        const headerIcon = document.getElementById('header-logo-icon');
        if (headerImg && headerIcon) { headerImg.classList.add('hidden'); headerImg.src = ''; headerIcon.classList.remove('hidden'); }
        const sideImg = document.getElementById('sidebar-logo-img');
        const sideIcon = document.getElementById('sidebar-logo-icon');
        if (sideImg && sideIcon) { sideImg.classList.add('hidden'); sideImg.src = ''; sideIcon.classList.remove('hidden'); }
        const sideName = document.getElementById('sidebar-instituto-nombre');
        if (sideName) sideName.textContent = 'Panel Institucional';
        lucide.createIcons();
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
        const view = document.getElementById('view-' + id);

        document.getElementById('page-title').textContent = titles[id] || id;
        if (id === 'dashboard') cargarDashboardInstituto();
        if (id === 'cursos') cargarCursosInstituto();
        if (id === 'certificados') cargarCertificadosInstituto();

    async function cargarDashboardInstituto() {

        try {

    async function cargarCursosInstituto() {
        const tbody = document.getElementById('cursos-body');
        if (!tbody) return;
        tbody.innerHTML = '<tr><td colspan="5" class="p-3 text-center text-slate-400">Cargando...</td></tr>';
        try {
            const { data: cursos, error } = await db.from('renmcycf_aliados_cursos').select('*').eq('aliado_id', aliadoId).eq('tenant_id', currentTenantId).order('created_at', { ascending: false });
            if (error) throw error;
            cursosCargados = cursos || [];
            if (!cursos || cursos.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="p-3 text-center text-slate-400">No hay cursos propuestos aún.</td></tr>'; return; }
            tbody.innerHTML = cursos.map(c => {
                const tieneDocumentacion = c.programa_url && c.analitico_url && c.diploma_base_url;
                let celdaDocumentacion = '';
                if (tieneDocumentacion) {
                    celdaDocumentacion = `<div class="flex flex-col gap-1"><span class="inline-flex items-center gap-1.5 bg-emerald-900/30 text-emerald-400 border border-emerald-500/40 px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider w-max"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Documentación Adjuntada</span><span class="text-[9px] text-slate-500 italic">Enviados a Comité</span></div>`;
                } else {
                    const faltantes = [];
                    if (!c.programa_url) faltantes.push('Programa');
                    if (!c.analitico_url) faltantes.push('Analítico');
                    if (!c.diploma_base_url) faltantes.push('Diploma');
                    celdaDocumentacion = `<div class="flex flex-col gap-1"><span class="inline-flex items-center gap-1.5 bg-amber-900/30 text-amber-400 border border-amber-500/40 px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider w-max"><i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> Incompleto</span><span class="text-[9px] text-slate-500 italic">Falta: ${faltantes.join(', ')}</span></div>`;
                }
                const esEditable = c.estado === 'PENDIENTE' || c.estado === 'RECHAZADO';
                const editTooltip = esEditable ? 'Editar curso' : 'Editar (ya aprobado — los cambios reinician la auditoría)';
                return `
                <tr class="border-b border-white/5 hover:bg-white/5">
                    <td class="p-3"><span class="text-white font-bold block text-sm">${c.nombre_curso}</span><span class="text-[10px] text-slate-400 block"><i data-lucide="clock" class="inline w-3 h-3"></i> ${c.carga_horaria || 'S/D'}</span></td>
                    <td class="p-3 text-[10px] text-blue-400"><i data-lucide="users" class="inline w-3 h-3"></i> ${c.cuerpo_docente || 'S/D'}</td>
                    <td class="p-3">${celdaDocumentacion}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-[9px] font-bold uppercase ${c.estado==='APROBADO'?'bg-emerald-900/30 text-emerald-400':(c.estado==='RECHAZADO'?'bg-red-900/30 text-red-400':'bg-amber-900/30 text-amber-400')}">${c.estado || 'PENDIENTE'}</span></td>
                    <td class="p-3 text-right"><div class="flex items-center justify-end gap-2">
                        <button onclick="abrirModalEdicion('${c.id}')" class="p-2 rounded-lg bg-blue-500/20 hover:bg-blue-500/40 text-blue-400 transition-colors" title="${editTooltip}"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                        <button onclick="eliminarCurso('${c.id}', '${(c.nombre_curso || '').replace(/'/g, "\\'")}')" class="p-2 rounded-lg bg-red-500/20 hover:bg-red-500/40 text-red-400 transition-colors" title="Eliminar curso"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div></td>
                </tr>`;
            }).join('');
            lucide.createIcons();
        } catch (err) { tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-red-400">Error: ${err.message}</td></tr>`; }
    }

    function abrirModalEdicion(cursoId) {
        const curso = cursosCargados.find(c => c.id === cursoId);
        if (!curso) return alert('No se encontró el curso.');
        document.getElementById('edit-curso-id').value = curso.id;
        document.getElementById('edit-curso-nombre').value = curso.nombre_curso || '';
        document.getElementById('edit-curso-carga').value = curso.carga_horaria || '';
        document.getElementById('edit-curso-docentes').value = curso.cuerpo_docente || '';
        document.getElementById('edit-curso-estado').value = curso.estado || 'PENDIENTE';
        document.getElementById('edit-curso-file-programa').value = '';
        document.getElementById('edit-curso-file-analitico').value = '';
        document.getElementById('edit-curso-file-diploma').value = '';

            const el = document.getElementById(id);
            if (url) { el.textContent = '✓ Ya cargado'; el.className = 'text-[9px] font-bold uppercase tracking-widest text-emerald-400'; }
            else { el.textContent = '⚠ Faltante'; el.className = 'text-[9px] font-bold uppercase tracking-widest text-amber-400'; }
        };
        setEstado('edit-estado-programa', curso.programa_url);
        setEstado('edit-estado-analitico', curso.analitico_url);
        setEstado('edit-estado-diploma', curso.diploma_base_url);

        editorState.edit = defaultEditorState();
        if (curso.diseno_config) {
            try {
                const cfg = typeof curso.diseno_config === 'string' ? JSON.parse(curso.diseno_config) : curso.diseno_config;
                Object.assign(editorState.edit, cfg);
            } catch(e) { console.warn('Error parseando diseno_config:', e); }
        } else {
            editorState.edit.posX = curso.pos_x || 50;
            editorState.edit.posY = curso.pos_y || 50;
        }
        if (curso.diploma_base_url) {
            editorState.edit.diplomaImage = curso.diploma_base_url;
        }
        const hx = document.getElementById('edit-pos-x');
        const hy = document.getElementById('edit-pos-y');
        const hc = document.getElementById('edit-diseno-config');
        if (hx) hx.value = editorState.edit.posX;
        if (hy) hy.value = editorState.edit.posY;
        if (hc) hc.value = JSON.stringify({
            posX: editorState.edit.posX, posY: editorState.edit.posY,

    async function guardarEdicionCurso(e) {
        e.preventDefault();
        const cursoId = document.getElementById('edit-curso-id').value;
        if (!cursoId) return;
        const btn = document.getElementById('btn-guardar-edicion');
        const orig = btn.innerHTML;
        btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Guardando...';
        btn.disabled = true;
        lucide.createIcons();
        try {
            const nombre = document.getElementById('edit-curso-nombre').value.trim();
            const carga = document.getElementById('edit-curso-carga').value.trim();
            const docentes = document.getElementById('edit-curso-docentes').value.trim();
            const posX = editorState.edit.posX;
            const posY = editorState.edit.posY;
            const disenoConfig = JSON.stringify({
                posX: editorState.edit.posX, posY: editorState.edit.posY,
                fontFamily: editorState.edit.fontFamily, fontWeight: editorState.edit.fontWeight,
                fontSize: editorState.edit.fontSize, fontColor: editorState.edit.fontColor,
                textAlign: editorState.edit.textAlign, lineHeight: editorState.edit.lineHeight,
                autoFit: editorState.edit.autoFit, maxWidth: editorState.edit.maxWidth,
                showNombre: editorState.edit.showNombre, showDni: editorState.edit.showDni,
                showCurso: editorState.edit.showCurso, showCarga: editorState.edit.showCarga
            });
            const filePrograma = document.getElementById('edit-curso-file-programa').files[0];
            const fileAnalitico = document.getElementById('edit-curso-file-analitico').files[0];
            const fileDiploma = document.getElementById('edit-curso-file-diploma').files[0];
            const ts = Date.now();
            const bucket = 'renmcycf-documentos';
            const subirArchivo = async (file, prefijo) => {
                const ext = file.name.split('.').pop();
                const fileName = `${currentTenantId}_${aliadoId}_${prefijo}_${ts}_${Math.floor(Math.random()*1000)}.${ext}`;
                const { error: upErr } = await db.storage.from(bucket).upload(fileName, file, { cacheControl: '3600', upsert: false });
                if (upErr) throw new Error(`Error subiendo ${prefijo}: ${upErr.message}`);
                return `${PROJECT_URL}/storage/v1/object/public/${bucket}/${fileName}`;
            };
            const updates = {
                nombre_curso: nombre, carga_horaria: carga, cuerpo_docente: docentes,
                pos_x: posX, pos_y: posY, diseno_config: disenoConfig
            };
            if (filePrograma) updates.programa_url = await subirArchivo(filePrograma, 'programa');
            if (fileAnalitico) updates.analitico_url = await subirArchivo(fileAnalitico, 'analitico');
            if (fileDiploma) updates.diploma_base_url = await subirArchivo(fileDiploma, 'diploma_base');
            const { error: updErr } = await db.from('renmcycf_aliados_cursos').update(updates).eq('id', cursoId).eq('aliado_id', aliadoId).eq('tenant_id', currentTenantId);
            if (updErr) throw updErr;
            alert('✅ Curso actualizado correctamente.');
            cerrarModalEdicion();
            cargarCursosInstituto();
        } catch (err) {
            console.error('Error al editar curso:', err);
            alert('Error al guardar los cambios: ' + err.message);
        } finally {
            btn.innerHTML = orig;
            btn.disabled = false;
            lucide.createIcons();
        }
    }

                aviso.classList.remove('hidden');
                selectCurso.disabled = true;
                btnEmitir.disabled = true;
                btnEmitir.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                aviso.classList.add('hidden');
                selectCurso.disabled = false;
                btnEmitir.disabled = false;
                btnEmitir.classList.remove('opacity-50', 'cursor-not-allowed');
                cursosAprobados.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.nombre_curso;
                    opt.dataset.carga = c.carga_horaria || '';
                    opt.dataset.diplomaUrl = c.diploma_base_url || '';
                    opt.dataset.posX = c.pos_x || 50;
                    opt.dataset.posY = c.pos_y || 50;
                    opt.dataset.disenoConfig = c.diseno_config || '';
                    selectCurso.appendChild(opt);
                });
            }
            const { data: certificados, error: errCert } = await db.from('renmcycf_certificados_b2b').select('*').eq('aliado_id', aliadoId).eq('tenant_id', currentTenantId).order('created_at', { ascending: false });
            if (errCert) throw errCert;
            if (!certificados || certificados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-3 text-center text-slate-400">Aún no se emitieron certificados.</td></tr>';
            } else {
                tbody.innerHTML = certificados.map(cert => `
                <tr class="border-b border-white/5 hover:bg-white/5">
                    <td class="p-3 text-white font-bold text-xs">${cert.alumno_nombres || cert.alumno_nombre || ''} ${cert.alumno_apellidos || ''}</td>
                    <td class="p-3 font-mono text-xs text-slate-300">${cert.alumno_dni}</td>
                    <td class="p-3 text-xs text-slate-400">${cert.curso_nombre || 'S/D'}</td>
                    <td class="p-3 text-[10px] text-slate-400">${cert.created_at ? new Date(cert.created_at).toLocaleDateString('es-AR') : 'S/D'}</td>
                    <td class="p-3 text-right">${cert.pdf_url ? `<a href="${cert.pdf_url}" target="_blank" class="bg-blue-500/20 text-blue-400 p-1.5 rounded hover:bg-blue-500/40 inline-block" title="Descargar PDF"><i data-lucide="download" class="w-4 h-4"></i></a>` : '<span class="text-slate-500 text-[10px]">Sin PDF</span>'}</td>
                </tr>`).join('');
                lucide.createIcons();
            }
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-red-400">Error: ${err.message}</td></tr>`;
        }
    }

    async function prepararPlantillaPDF(cursoData, alumno) {
        const { nombres, apellidos, dni, hashCert, fechaEmision, urlVerificacion } = alumno;
        let cfg = null;
        if (cursoData.diseno_config) {
            try { cfg = typeof cursoData.diseno_config === 'string' ? JSON.parse(cursoData.diseno_config) : cursoData.diseno_config; } catch(e) { cfg = null; }
        }
        const posX = cfg?.posX ?? cursoData.pos_x ?? 50;
        const posY = cfg?.posY ?? cursoData.pos_y ?? 50;
        const fontFamily = cfg?.fontFamily || "'Outfit', sans-serif";
        const fontWeight = cfg?.fontWeight || 900;
        const fontSize = cfg?.fontSize || 42;
        const fontColor = cfg?.fontColor || 'var(--wl-primary)';
        const textAlign = cfg?.textAlign || 'center';
        const lineHeight = cfg?.lineHeight || 1.1;
        const maxWidth = cfg?.maxWidth || 80;
        const showNombre = cfg?.showNombre !== false;
        const showDni = cfg?.showDni !== false;
        const showCurso = cfg?.showCurso !== false;
        const showCarga = cfg?.showCarga !== false;
        const areaDiploma = document.getElementById('area-diploma-base');
        if (cursoData.diploma_base_url) {
            areaDiploma.style.backgroundImage = `url('${cursoData.diploma_base_url}')`;
            areaDiploma.style.backgroundSize = 'contain';
            areaDiploma.style.backgroundPosition = 'center';
            areaDiploma.style.backgroundRepeat = 'no-repeat';
        }
        const datosFlotantes = document.getElementById('datos-alumno-flotante');
        datosFlotantes.style.top = `${posY}%`;
        datosFlotantes.style.left = `${posX}%`;
        datosFlotantes.style.transform = 'translate(-50%, -50%)';
        datosFlotantes.style.maxWidth = `${maxWidth}%`;
        datosFlotantes.style.textAlign = textAlign;
        const elNombre = document.getElementById('pdf-alumno');
        const elDni = document.getElementById('pdf-dni');
        const elCurso = document.getElementById('pdf-curso');
        const elCarga = document.getElementById('pdf-carga');
        elNombre.textContent = showNombre ? `${nombres} ${apellidos}` : '';
        elNombre.style.fontFamily = fontFamily;
        elNombre.style.fontWeight = fontWeight;
        elNombre.style.fontSize = (fontSize * 1.3) + 'px';
        elNombre.style.color = fontColor;
        elNombre.style.lineHeight = lineHeight;
        elNombre.style.textAlign = textAlign;
        elNombre.style.display = showNombre ? 'block' : 'none';
        elDni.textContent = showDni ? `DNI: ${dni}` : '';
        elDni.style.display = showDni ? 'block' : 'none';
        elCurso.textContent = showCurso ? (cursoData.nombre_curso || '') : '';
        elCurso.style.display = showCurso ? 'block' : 'none';
        elCarga.textContent = showCarga ? `Carga Horaria: ${cursoData.carga_horaria || 'No especificada'}` : '';
        elCarga.style.display = showCarga ? 'block' : 'none';
        document.getElementById('pdf-hash').textContent = hashCert;
        document.getElementById('pdf-fecha').textContent = fechaEmision;
        const qrContainer = document.getElementById('pdf-qr-container');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, { text: urlVerificacion, width: 90, height: 90, colorDark: "#0f172a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
        await inyectarLogoOficialFaldon();
        await new Promise(resolve => setTimeout(resolve, 500));
    }

    async function inyectarLogoOficialFaldon() {
        try {
            const { data: configTenant } = await db.from('renmcycf_config').select('logo_url').eq('tenant_id', currentTenantId).maybeSingle();
            const wrapper = document.querySelector('#faldon-trazabilidad .logo-oficial-wrapper');
            if (!wrapper) return;
            wrapper.innerHTML = '';
            if (configTenant && configTenant.logo_url) {
                const imgOficial = document.createElement('img');
                imgOficial.src = configTenant.logo_url;
                imgOficial.className = 'w-full h-full object-contain mix-blend-multiply p-1';
                imgOficial.crossOrigin = 'anonymous';
                wrapper.appendChild(imgOficial);
            } else {
                wrapper.innerHTML = '<i data-lucide="shield-check" style="width: 30px; height: 30px; color: var(--wl-secondary);"></i>';
                lucide.createIcons();
            }
        } catch (e) { console.warn('No se pudo inyectar logo oficial:', e); }
    }

    async function emitirCertificado(e) {
        e.preventDefault();
        if (!aliadoId || !institutoActual) return alert("Error: Sesión de instituto no válida.");
        const selectCurso = document.getElementById('cert-curso');
        const cursoId = selectCurso.value;
        const optSeleccionada = selectCurso.options[selectCurso.selectedIndex];
        const cursoNombre = optSeleccionada.text;
        const cursoCarga = optSeleccionada.dataset.carga;
        const diplomaUrl = optSeleccionada.dataset.diplomaUrl;
        const posX = parseInt(optSeleccionada.dataset.posX) || 50;
        const posY = parseInt(optSeleccionada.dataset.posY) || 50;
        const disenoConfig = optSeleccionada.dataset.disenoConfig || '';
        const nombres = document.getElementById('cert-nombre').value.trim();
        const apellidos = document.getElementById('cert-apellidos').value.trim();
        const dni = document.getElementById('cert-dni').value.trim();
        if (!cursoId) return alert("Debe seleccionar un curso válido.");
        const btn = document.getElementById('btn-emitir');
        const origHTML = btn.innerHTML;
        btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> VALIDANDO SALDO...';
        btn.disabled = true;
        lucide.createIcons();
        try {
            const { data: aliadoDB, error: errAliado } = await db.from('renmcycf_aliados').select('saldo_timbres').eq('id', aliadoId).eq('tenant_id', currentTenantId).single();
            if (errAliado) throw new Error("Error al consultar saldo.");
            if (!aliadoDB.saldo_timbres || aliadoDB.saldo_timbres <= 0) throw new Error("Saldo Insuficiente. Adquiera más Derechos de Emisión para continuar emitiendo.");
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> GENERANDO CERTIFICADO...';
            const hashCert = `ASARI-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;
            const baseHost = window.location.origin;
            const urlVerificacion = `${baseHost}/certificado.html?hash=${hashCert}`;
            const fechaEmision = new Date().toLocaleDateString('es-AR');
            await prepararPlantillaPDF(
                { nombre_curso: cursoNombre, carga_horaria: cursoCarga, diploma_base_url: diplomaUrl, pos_x: posX, pos_y: posY, diseno_config: disenoConfig },
                { nombres, apellidos, dni, hashCert, fechaEmision, urlVerificacion }
            );
            const renderZone = document.getElementById('cert-template');
            const canvas = await html2canvas(renderZone, { scale: 3, useCORS: true, backgroundColor: '#ffffff', logging: false });
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 297, 210);
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> ENCRIPTANDO Y SUBIENDO...';
            const pdfBlob = pdf.output('blob');
            const pdfFileName = `${currentTenantId}/B2B_${hashCert}.pdf`;
            const { error: uploadError } = await db.storage.from('renmcycf-pdfs').upload(pdfFileName, pdfBlob, { cacheControl: '3600', upsert: true });
            if (uploadError) throw new Error("Error al guardar el documento en la nube.");
            const pdfUrl = `${PROJECT_URL}/storage/v1/object/public/renmcycf-pdfs/${pdfFileName}`;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> REGISTRANDO TRAZABILIDAD...';
            const { error: insertError } = await db.from('renmcycf_certificados_b2b').insert([{
                tenant_id: currentTenantId,
                aliado_id: aliadoId, curso_id: cursoId,
                alumno_nombres: nombres, alumno_apellidos: apellidos, alumno_dni: dni,
                hash_cert: hashCert, pdf_url: pdfUrl
            }]);
            if (insertError) throw new Error("Error al registrar en base de datos.");
            const { error: updateError } = await db.from('renmcycf_aliados').update({ saldo_timbres: aliadoDB.saldo_timbres - 1 }).eq('id', aliadoId).eq('tenant_id', currentTenantId);
            if (updateError) throw new Error("Emisión registrada, pero hubo error al descontar el Derecho de Emisión.");
            alert(`✅ CERTIFICADO EMITIDO EXITOSAMENTE\nHash: ${hashCert}\nSaldo actualizado.`);
            pdf.save(`Certificado_${dni}.pdf`);
            document.getElementById('form-certificado').reset();
            await cargarDashboardInstituto();
            cargarCertificadosInstituto();
        } catch (err) {
            alert(err.message);
        } finally {
            btn.innerHTML = origHTML;
            btn.disabled = false;
            lucide.createIcons();
        }
    }

    // ==========================================
    // 10. EMISIÓN MASIVA POR EXCEL
    // ==========================================
    function descargarPlantillaExcel() {
        const ws_data = [['NOMBRES', 'APELLIDOS', 'DNI'], ['Juan Carlos', 'Pérez', '35123456'], ['María Belén', 'Gómez', '38987654']];
        const ws = XLSX.utils.aoa_to_sheet(ws_data);
        ws['!cols'] = [{ wch: 25 }, { wch: 25 }, { wch: 15 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Alumnos");
        XLSX.writeFile(wb, "Plantilla_Alumnos.xlsx");
    }

    async function procesarEmisionMasiva() {
        if (!aliadoId || !institutoActual) return alert("Error: Sesión no válida.");
        const selectCurso = document.getElementById('cert-curso');
        const cursoId = selectCurso.value;
        const optSeleccionada = selectCurso.options[selectCurso.selectedIndex];
        const cursoNombre = optSeleccionada?.text;
        const cursoCarga = optSeleccionada?.dataset.carga;
        const diplomaUrl = optSeleccionada?.dataset.diplomaUrl;
        const posX = parseInt(optSeleccionada?.dataset.posX) || 50;
        const posY = parseInt(optSeleccionada?.dataset.posY) || 50;
        const disenoConfig = optSeleccionada?.dataset.disenoConfig || '';
        if (!cursoId) return alert("Por favor, seleccione un curso aprobado.");
        const fileInput = document.getElementById('file-excel-masivo');
        if (!fileInput.files.length) return alert("Debe seleccionar un archivo Excel.");
        const file = fileInput.files[0];
        const btn = document.getElementById('btn-emitir-masivo');
        const progresoDiv = document.getElementById('progreso-masivo');
        const progresoTexto = document.getElementById('progreso-texto');
        const progresoBarra = document.getElementById('progreso-barra');
        const progresoPorcentaje = document.getElementById('progreso-porcentaje');
        btn.disabled = true;
        progresoDiv.classList.remove('hidden');
        progresoTexto.innerText = "Leyendo archivo Excel...";
        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                const alumnosValidos = rows.filter(r => r.NOMBRES && r.APELLIDOS && r.DNI);
                const total = alumnosValidos.length;
                if (total === 0) throw new Error("No se encontraron alumnos válidos.");
                progresoTexto.innerText = "Validando saldo...";
                const { data: aliadoDB, error: errAliado } = await db.from('renmcycf_aliados').select('saldo_timbres').eq('id', aliadoId).eq('tenant_id', currentTenantId).single();
                if (errAliado || !aliadoDB) throw new Error("Error al consultar saldo.");
                let saldoRestante = aliadoDB.saldo_timbres || 0;
                if (saldoRestante < total) throw new Error(`Saldo Insuficiente. Intentas emitir ${total}, tienes ${saldoRestante}.`);
                if(!confirm(`Se procesarán ${total} certificados y se consumirán ${total} Derechos.\n¿Continuar?`)) throw new Error("Proceso cancelado.");
                const zip = new JSZip();
                const fechaEmision = new Date().toLocaleDateString('es-AR');
                let exitosos = 0;
                const registrosInsert = [];
                for (let i = 0; i < total; i++) {
                    const alumno = alumnosValidos[i];
                    const nombres = alumno.NOMBRES.toString().trim();
                    const apellidos = alumno.APELLIDOS.toString().trim();
                    const dni = alumno.DNI.toString().trim();
                    progresoTexto.innerText = `Generando PDF ${i + 1} de ${total}...`;
                    const porcentaje = Math.round((i / total) * 100);
                    progresoBarra.style.width = `${porcentaje}%`;
                    progresoPorcentaje.innerText = `${porcentaje}%`;
                    const hashCert = `ASARI-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;
                    const urlVerificacion = `${window.location.origin}/certificado.html?hash=${hashCert}`;
                    await prepararPlantillaPDF(
                        { nombre_curso: cursoNombre, carga_horaria: cursoCarga, diploma_base_url: diplomaUrl, pos_x: posX, pos_y: posY, diseno_config: disenoConfig },
                        { nombres, apellidos, dni, hashCert, fechaEmision, urlVerificacion }
                    );
                    const renderZone = document.getElementById('cert-template');
                    const canvas = await html2canvas(renderZone, { scale: 3, useCORS: true, backgroundColor: '#ffffff', logging: false });
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 297, 210);
                    progresoTexto.innerText = `Subiendo ${i + 1} de ${total}...`;
                    const pdfBlob = pdf.output('blob');
                    const pdfFileName = `${currentTenantId}/B2B_${hashCert}.pdf`;
                    const { error: uploadError } = await db.storage.from('renmcycf-pdfs').upload(pdfFileName, pdfBlob, { cacheControl: '3600', upsert: true });
                    if (uploadError) throw new Error("Error al guardar en la nube.");
                    const pdfUrl = `${PROJECT_URL}/storage/v1/object/public/renmcycf-pdfs/${pdfFileName}`;
                    const arrayBuffer = await pdfBlob.arrayBuffer();
                    zip.file(`Certificado_${dni}_${nombres.split(' ')[0]}.pdf`, arrayBuffer);
                    registrosInsert.push({
                        tenant_id: currentTenantId,
                        aliado_id: aliadoId, curso_id: cursoId,
                        alumno_nombres: nombres, alumno_apellidos: apellidos, alumno_dni: dni,
                        hash_cert: hashCert, pdf_url: pdfUrl
                    });
                    exitosos++;
                    saldoRestante--;
                }
                progresoTexto.innerText = "Registrando en base de datos...";
                const { error: insertError } = await db.from('renmcycf_certificados_b2b').insert(registrosInsert);
                if (insertError) throw new Error("Error al registrar emisiones.");
                const { error: updateError } = await db.from('renmcycf_aliados').update({ saldo_timbres: saldoRestante }).eq('id', aliadoId).eq('tenant_id', currentTenantId);
                if (updateError) console.error("Error descontando Derechos, pero los certificados se emitieron.");
                progresoTexto.innerText = "Comprimiendo ZIP...";
                progresoBarra.style.width = "100%";
                progresoPorcentaje.innerText = "100%";
                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, `Certificados_Masivos_${cursoNombre.replace(/[^a-z0-9]/gi, '_')}.zip`);
                alert(`✅ Proceso finalizado. Se generaron ${exitosos} certificados.`);
                fileInput.value = "";
                await cargarDashboardInstituto();
                cargarCertificadosInstituto();
            } catch (err) {
                alert("Se detuvo el proceso: " + err.message);
            } finally {
                btn.disabled = false;
                progresoDiv.classList.add('hidden');
                progresoBarra.style.width = "0%";
            }
        };
        reader.readAsArrayBuffer(file);
    }

    window.addEventListener('DOMContentLoaded', async () => {
        await initTenant();
        aplicarTemaGuardado();
        _editorInitListeners();
        _initAltaImageWatcher();
        _initEditImageWatcher();
        await verificarSesion();
        lucide.createIcons();
    });
