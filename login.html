<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="google" content="notranslate">
    <title>Acceso al Panel · <span id="wl-title-institucion">Panel de Administración</span></title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="saas-core.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Montserrat:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wlPrimary: 'var(--wl-primary)',
                        wlSecondary: 'var(--wl-secondary)',
                        wlTertiary: 'var(--wl-tertiary)',
                        wlBackground: 'var(--wl-background)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        title: ['Montserrat', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        :root { 
            --wl-primary: #0f172a; 
            --wl-secondary: #d4af37; 
            --wl-tertiary: #1e3a8a; 
            --wl-background: #f8fafc;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, var(--wl-primary) 0%, var(--wl-tertiary) 50%, var(--wl-primary) 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        body.ready { opacity: 1; }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--wl-secondary), var(--wl-tertiary), var(--wl-secondary));
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            background: #f8fafc;
            color: #1e293b;
            font-family: 'Inter', sans-serif;
        }
        
        .input-field:focus {
            border-color: var(--wl-secondary);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
            background: #ffffff;
        }
        
        .input-field::placeholder {
            color: #94a3b8;
        }
        
        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--wl-primary);
            color: var(--wl-secondary);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-login:hover {
            background: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.5);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 12px 16px;
            color: #dc2626;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .success-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 12px 16px;
            color: #16a34a;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .lock-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--wl-primary), var(--wl-tertiary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.3);
            border: 3px solid var(--wl-secondary);
        }
        
        .forgot-link {
            color: #64748b;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .forgot-link:hover {
            color: var(--wl-primary);
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            background: var(--wl-secondary);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 8s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(90deg); }
            75% { transform: translateY(10px) rotate(270deg); }
        }
        
        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-top-color: var(--wl-secondary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <!-- Contenedor de Login -->
    <div class="login-container" style="z-index: 10;">
        
        <!-- Icono de candado -->
        <div class="lock-icon">
            <i data-lucide="shield-check" style="width: 32px; height: 32px; color: var(--wl-secondary);"></i>
        </div>
        
        <!-- Logo y título -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black mb-1" style="font-family: 'Montserrat', sans-serif; color: var(--wl-primary);">
                <span id="wl-institucion-nombre">Cargando...</span>
            </h1>
            <p class="text-[10px] font-bold uppercase tracking-[0.3em]" style="color: var(--wl-secondary);">
                Centro de Comando
            </p>
            <p class="text-xs text-slate-400 mt-3 font-medium">
                Acceso restringido a personal autorizado
            </p>
        </div>
        
        <!-- Mensaje de error -->
        <div id="error-message" class="hidden mb-4"></div>
        
        <!-- Mensaje de éxito -->
        <div id="success-message" class="hidden mb-4"></div>
        
        <!-- Formulario -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                    <i data-lucide="mail" class="inline w-3 h-3 mr-1"></i> Correo Electrónico
                </label>
                <input 
                    type="email" 
                    id="email" 
                    class="input-field" 
                    placeholder="usuario@institucion.com" 
                    required 
                    autocomplete="email"
                    autofocus
                >
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                    <i data-lucide="key" class="inline w-3 h-3 mr-1"></i> Contraseña
                </label>
                <input 
                    type="password" 
                    id="password" 
                    class="input-field" 
                    placeholder="••••••••••••" 
                    required 
                    autocomplete="current-password"
                >
            </div>
            
            <button type="submit" class="btn-login" id="btn-submit">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                INGRESAR AL PANEL
            </button>
        </form>
        
        <!-- Links adicionales -->
        <div class="mt-6 text-center space-y-2">
            <p class="forgot-link" onclick="showResetInfo()">
                ¿Olvidaste tu contraseña? Contacta al administrador
            </p>
            <a href="index.html" class="block text-[10px] text-slate-400 hover:text-slate-600 transition-colors font-medium">
                ← Volver al sitio público
            </a>
        </div>
        
        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-slate-200 text-center">
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">
                Tecnología SaaS Multi-Tenant © 2026
            </p>
        </div>
    </div>

    <script>
        // ============================================================
        // BOOTSTRAPPER SaaS (inyectado por saas-core.js)
        // ============================================================

        // ============================================================
        // PARTÍCULAS DE FONDO
        // ============================================================
        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#d4af37', '#3b82f6', '#ffffff', '#d4af37'];
            
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 4 + 2;
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const duration = Math.random() * 10 + 5;
                const delay = Math.random() * 5;
                
                particle.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    left: ${x}%;
                    top: ${y}%;
                    animation-duration: ${duration}s;
                    animation-delay: ${delay}s;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                `;
                
                container.appendChild(particle);
            }
        }

        // ============================================================
        // MANEJO DEL LOGIN
        // ============================================================
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            
            if (!email || !password) {
                showError('Por favor completa todos los campos.');
                return;
            }
            
            if (password.length < 8) {
                showError('La contraseña debe tener al menos 8 caracteres.');
                return;
            }
            
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<div class="loader"></div> VERIFICANDO CREDENCIALES...';
            btn.disabled = true;
            
            try {
                const { data: authData, error: authError } = await window.db.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (authError) {
                    if (authError.message.includes('Invalid login credentials')) {
                        throw new Error('Correo o contraseña incorrectos.');
                    } else if (authError.message.includes('Email not confirmed')) {
                        throw new Error('El correo no ha sido confirmado.');
                    } else {
                        throw new Error(authError.message);
                    }
                }
                
                if (!authData.user) {
                    throw new Error('No se pudo obtener la información del usuario.');
                }
                
                const { data: rolData, error: rolError } = await window.db
                    .from('renmcycf_roles')
                    .select('*')
                    .eq('user_id', authData.user.id)
                    .eq('tenant_id', window.currentTenantId)
                    .eq('activo', true)
                    .maybeSingle();
                
                if (rolError || !rolData) {
                    await window.db.auth.signOut();
                    throw new Error('No tienes permisos en esta institución.');
                }
                
                await window.db.from('renmcycf_roles')
                    .update({ ultimo_acceso: new Date().toISOString() })
                    .eq('id', rolData.id)
                    .eq('tenant_id', window.currentTenantId);
                
                successDiv.classList.remove('hidden');
                successDiv.innerHTML = `
                    <div class="success-box">
                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                        Acceso concedido. Redirigiendo al panel...
                    </div>
                `;
                lucide.createIcons();
                
                localStorage.setItem('saas_session', JSON.stringify({
                    user_id: authData.user.id,
                    email: authData.user.email,
                    rol: rolData.rol,
                    nombre: rolData.nombres || authData.user.email,
                    tenant_id: window.currentTenantId,
                    session_expires: Date.now() + (8 * 60 * 60 * 1000)
                }));
                
                setTimeout(() => {
                    window.location.href = 'panel.html';
                }, 1000);
                
            } catch (err) {
                showError(err.message);
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                lucide.createIcons();
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.remove('hidden');
            errorDiv.innerHTML = `
                <div class="error-box">
                    <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                    <span>${message}</span>
                </div>
            `;
            lucide.createIcons();
        }
        
        function showResetInfo() {
            alert('📧 Contacta al administrador del sistema de tu institución.');
        }
        
        async function checkExistingSession() {
            const { data: { session } } = await window.db.auth.getSession();
            if (session) {
                const storedUser = localStorage.getItem('saas_session');
                if (storedUser) {
                    const userData = JSON.parse(storedUser);
                    if (userData.session_expires > Date.now() && userData.tenant_id === window.currentTenantId) {
                        setTimeout(() => {
                            window.location.href = 'panel.html';
                        }, 800);
                        return;
                    }
                }
                await window.db.auth.signOut();
                localStorage.removeItem('saas_session');
            }
        }
        
        window.addEventListener('DOMContentLoaded', async () => {
            await window.initTenant();
            createParticles();
            lucide.createIcons();
            checkExistingSession();
            
            document.getElementById('password').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    handleLogin(e);
                }
            });
        });
    </script>
</body>
</html>
